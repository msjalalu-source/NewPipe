name: "Build signed APK"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Restore or generate debug keystore"
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE}/debug.keystore"
          BASE64_FILE="${GITHUB_WORKSPACE}/debug.keystore.base64"
          echo "Target keystore path: ${TARGET_KEYSTORE}"

          if [ -s "${TARGET_KEYSTORE}" ]; then
            echo "Keystore already exists at ${TARGET_KEYSTORE} and is non-empty."
          elif [ -f "${BASE64_FILE}" ]; then
            echo "Found ${BASE64_FILE}. Restoring Build 81 debug keystore..."
            base64 --decode "${BASE64_FILE}" > "${TARGET_KEYSTORE}" || base64 -d "${BASE64_FILE}" > "${TARGET_KEYSTORE}"
          else
            echo "Original Build 81 keystore file (debug.keystore or debug.keystore.base64) was not found in checked-out repository files."
            echo "Generating safe personal-use debug keystore fallback on runner using keytool..."
            keytool -genkey -v -keystore "${TARGET_KEYSTORE}" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: "Verify debug keystore exists"
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE}/debug.keystore"
          if [ ! -f "${TARGET_KEYSTORE}" ]; then
            echo "::error::debug.keystore not found at expected path: ${TARGET_KEYSTORE}"
            ls -la "${GITHUB_WORKSPACE}"
            exit 1
          fi
          if [ ! -s "${TARGET_KEYSTORE}" ]; then
            echo "::error::debug.keystore is empty (0 bytes) at: ${TARGET_KEYSTORE}"
            exit 1
          fi
          FILE_SIZE=$(wc -c < "${TARGET_KEYSTORE}")
          echo "SUCCESS: debug.keystore verified at ${TARGET_KEYSTORE} (${FILE_SIZE} bytes)."
          keytool -list -v -keystore "${TARGET_KEYSTORE}" -storepass android -alias androiddebugkey
          echo "SUCCESS: Key alias 'androiddebugkey' confirmed in keystore."

      - name: "Build signed debug APK"
        run: ./gradlew assembleDebug --stacktrace

      - name: "Verify APK signature"
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /opt/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          else
            echo "apksigner not found, skipping signature check"
          fi

      - name: "Rename APK"
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/debug/output-metadata.json")"
          echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "app/build/outputs/apk/debug/output-metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mv app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/NewPipe_v${VERSION_NAME}_debug.apk"

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

