name: "Build and publish signed APK"

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK to GitHub Releases'
        type: boolean
        required: true
        default: true
      tag_name:
        description: 'Release tag (e.g. v0.29.1-debug.1; leave blank to auto-generate)'
        type: string
        required: false
        default: ''
      release_title:
        description: 'Release title (optional, e.g. NewPipe Debug v0.29.1)'
        type: string
        required: false
        default: ''
      release_notes:
        description: 'Release notes (optional)'
        type: string
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: true
        default: false
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Restore or generate debug keystore"
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE}/debug.keystore"
          BASE64_FILE="${GITHUB_WORKSPACE}/debug.keystore.base64"
          echo "Target keystore path: ${TARGET_KEYSTORE}"

          if [ -s "${TARGET_KEYSTORE}" ]; then
            echo "Keystore already exists at ${TARGET_KEYSTORE} and is non-empty."
          elif [ -f "${BASE64_FILE}" ]; then
            echo "Found ${BASE64_FILE}. Restoring Build 81 debug keystore..."
            base64 --decode "${BASE64_FILE}" > "${TARGET_KEYSTORE}" || base64 -d "${BASE64_FILE}" > "${TARGET_KEYSTORE}"
          else
            echo "Original Build 81 keystore file (debug.keystore or debug.keystore.base64) was not found in checked-out repository files."
            echo "Generating safe personal-use debug keystore fallback on runner using keytool..."
            keytool -genkey -v -keystore "${TARGET_KEYSTORE}" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: "Verify debug keystore exists"
        run: |
          TARGET_KEYSTORE="${GITHUB_WORKSPACE}/debug.keystore"
          if [ ! -f "${TARGET_KEYSTORE}" ]; then
            echo "::error::debug.keystore not found at expected path: ${TARGET_KEYSTORE}"
            ls -la "${GITHUB_WORKSPACE}"
            exit 1
          fi
          if [ ! -s "${TARGET_KEYSTORE}" ]; then
            echo "::error::debug.keystore is empty (0 bytes) at: ${TARGET_KEYSTORE}"
            exit 1
          fi
          FILE_SIZE=$(wc -c < "${TARGET_KEYSTORE}")
          echo "SUCCESS: debug.keystore verified at ${TARGET_KEYSTORE} (${FILE_SIZE} bytes)."
          keytool -list -v -keystore "${TARGET_KEYSTORE}" -storepass android -alias androiddebugkey
          echo "SUCCESS: Key alias 'androiddebugkey' confirmed in keystore."

      - name: "Build signed debug APK"
        run: ./gradlew assembleDebug --stacktrace

      - name: "Verify APK signature"
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /opt/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          else
            echo "apksigner not found, skipping signature check"
          fi

      - name: "Prepare build summary"
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/debug/output-metadata.json")"
          echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "app/build/outputs/apk/debug/output-metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload APK artifact"
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: "Release publishing skipped notice"
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release == false || inputs.publish_release == 'false') && inputs.tag_name == ''
        run: |
          echo "### GitHub Release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Release publishing was unchecked for this manual run. The APK is available below under **Artifacts** (\`app-debug\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: "Validate and publish to GitHub Releases"
        if: |
          (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')) ||
          (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true' || inputs.tag_name != ''))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          # 1. Validate APK file exists and is non-empty
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK file not found at $APK_FILE"
            exit 1
          fi
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK file is empty (0 bytes) at $APK_FILE"
            exit 1
          fi
          APK_SIZE=$(wc -c < "$APK_FILE")
          echo "Validated APK: $APK_FILE ($APK_SIZE bytes)"

          # 2. Resolve tag name (custom input or auto-generated default)
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/debug/output-metadata.json" 2>/dev/null || echo "0.29.1")"
          TAG_NAME=$(echo "$INPUT_TAG_NAME" | xargs)
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v${VERSION_NAME}-debug.${GITHUB_RUN_NUMBER}"
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              TAG_NAME="${TAG_NAME}.${GITHUB_RUN_ATTEMPT}"
            fi
            echo "No custom tag provided; using automatic default tag: $TAG_NAME"
          fi

          if ! [[ "$TAG_NAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid tag name '$TAG_NAME'. Must contain only alphanumeric characters, dots, dashes, or underscores."
            exit 1
          fi

          # 3. Check for tag / release collisions
          echo "Checking if release '$TAG_NAME' already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ -z "$INPUT_TAG_NAME" ]; then
              TAG_NAME="${TAG_NAME}-$(date +%s)"
              echo "Release collision detected for auto-tag; adjusted to '$TAG_NAME'"
            else
              echo "::error::GitHub Release with tag '$TAG_NAME' already exists! Aborting to avoid overwrite."
              exit 1
            fi
          fi

          echo "Checking if Git tag '$TAG_NAME' already exists on remote..."
          if git ls-remote --tags origin "refs/tags/$TAG_NAME" 2>/dev/null | grep -q "refs/tags/$TAG_NAME$"; then
            if [ -z "$INPUT_TAG_NAME" ]; then
              TAG_NAME="${TAG_NAME}-$(date +%s)"
              echo "Git tag collision detected for auto-tag; adjusted to '$TAG_NAME'"
            else
              echo "::error::Git tag '$TAG_NAME' already exists on remote origin! Aborting to avoid tag collision."
              exit 1
            fi
          fi

          # 4. Set title and notes
          RELEASE_TITLE=$(echo "$INPUT_RELEASE_TITLE" | xargs)
          if [ -z "$RELEASE_TITLE" ]; then
            RELEASE_TITLE="NewPipe Debug $TAG_NAME"
          fi

          RELEASE_NOTES=$(echo "$INPUT_RELEASE_NOTES" | xargs)
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Automated personal debug build of NewPipe from commit ${GITHUB_SHA} (branch: ${GITHUB_REF_NAME})."
          fi

          # 5. Determine prerelease flag
          PRERELEASE_FLAG=""
          if [ "$INPUT_PRERELEASE" = "true" ] || [ "$INPUT_PRERELEASE" = true ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "Publishing release '$TAG_NAME' for commit ${GITHUB_SHA}..."
          gh release create "$TAG_NAME" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            $PRERELEASE_FLAG

          echo "SUCCESS: GitHub Release '$TAG_NAME' created with asset 'app-debug.apk'."
          echo "### GitHub Release Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Title:** $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Download Asset:** [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
